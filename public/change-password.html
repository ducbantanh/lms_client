<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Đổi mật khẩu · LAN LMS</title>
  <link rel="stylesheet" href="/vendor/fonts/source-sans-pro.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/vendor/adminlte/adminlte.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="hold-transition login-page app-loading" data-page="change-password">
  <div class="login-box app-content">
    <div class="login-logo">
      <i class="fas fa-key text-primary"></i> Đổi mật khẩu
    </div>
    <div class="card">
      <div class="card-body login-card-body">
        <div id="force-note" class="alert alert-warning d-none">
          <i class="fas fa-exclamation-triangle mr-1"></i>
          Đây là lần đăng nhập đầu tiên. Bạn cần đặt mật khẩu mới trước khi sử dụng hệ thống.
        </div>
        <p class="login-box-msg pb-2">Xin chào <b id="who"></b></p>

        <div id="form-error" class="alert alert-danger d-none" role="alert"></div>

        <form id="password-form" novalidate>
          <div class="form-group">
            <label for="current">Mật khẩu hiện tại</label>
            <input type="password" class="form-control" id="current" autocomplete="current-password" maxlength="128" required>
          </div>
          <div class="form-group">
            <label for="next">Mật khẩu mới</label>
            <input type="password" class="form-control" id="next" autocomplete="new-password" minlength="8" maxlength="128" required>
            <small class="form-text text-muted">Tối thiểu 8 ký tự, khác mật khẩu hiện tại.</small>
          </div>
          <div class="form-group">
            <label for="confirm">Nhập lại mật khẩu mới</label>
            <input type="password" class="form-control" id="confirm" autocomplete="new-password" maxlength="128" required>
          </div>
          <button type="submit" id="btn-save" class="btn btn-primary btn-block">Lưu mật khẩu</button>
        </form>

        <div class="d-flex justify-content-between mt-3">
          <a href="#" id="link-back" class="d-none">← Quay lại</a>
          <a href="#" id="link-logout" class="ml-auto">Đăng xuất</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/vendor/adminlte/adminlte.min.js"></script>
  <script type="module" src="/assets/js/auth-pages.js"></script>
</body>
</html>
