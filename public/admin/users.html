<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Người dùng · LAN LMS</title>
  <link rel="stylesheet" href="/vendor/fonts/source-sans-pro.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/vendor/adminlte/adminlte.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed app-loading">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light" id="app-navbar"></nav>
  <aside class="main-sidebar sidebar-dark-primary elevation-4" id="app-sidebar"></aside>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid d-flex flex-wrap justify-content-between align-items-center">
        <h1 class="m-0">Người dùng</h1>
        <div class="mt-2 mt-sm-0">
          <button type="button" class="btn btn-outline-primary btn-sm" data-toggle="modal" data-target="#create-modal">
            <i class="fas fa-user-plus mr-1"></i>Thêm tài khoản
          </button>
          <a href="/admin/import.html" class="btn btn-primary btn-sm">
            <i class="fas fa-file-import mr-1"></i>Import sinh viên
          </a>
        </div>
      </div>
    </div>

    <section class="content">
      <div class="container-fluid">
        <div class="card">
          <div class="card-header">
            <form id="filter-form" class="form-row w-100" autocomplete="off">
              <div class="col-md-5 mb-2 mb-md-0">
                <div class="input-group input-group-sm">
                  <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-search"></i></span></div>
                  <input type="search" id="q" class="form-control" placeholder="Tìm theo tài khoản hoặc họ tên" maxlength="64">
                </div>
              </div>
              <div class="col-6 col-md-3">
                <select id="role" class="form-control form-control-sm" aria-label="Vai trò">
                  <option value="">Tất cả vai trò</option>
                  <option value="0">Quản trị viên</option>
                  <option value="1">Giảng viên</option>
                  <option value="2">Sinh viên</option>
                  <option value="3">Khách (tự luyện)</option>
                </select>
              </div>
              <div class="col-6 col-md-3">
                <select id="status" class="form-control form-control-sm" aria-label="Trạng thái">
                  <option value="">Mọi trạng thái</option>
                  <option value="1">Đang hoạt động</option>
                  <option value="0">Bị khóa</option>
                </select>
              </div>
            </form>
          </div>

          <div class="card-body p-0 table-responsive">
            <table class="table table-hover table-striped mb-0">
              <thead>
                <tr class="text-nowrap">
                  <th>Tài khoản</th><th class="d-none d-md-table-cell">Họ tên</th><th class="d-none d-md-table-cell">Vai trò</th><th>Trạng thái</th>
                  <th class="d-none d-lg-table-cell">Đăng nhập gần nhất</th><th class="text-right">Thao tác</th>
                </tr>
              </thead>
              <tbody id="user-body">
                <tr><td colspan="6" class="empty-state">Đang tải...</td></tr>
              </tbody>
            </table>
          </div>

          <div class="card-footer d-flex flex-wrap justify-content-between align-items-center">
            <small class="text-muted" id="page-info"></small>
            <ul class="pagination pagination-sm m-0" id="pager"></ul>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer class="main-footer small">LAN LMS · beta</footer>

  <div class="modal fade" id="create-modal" tabindex="-1" role="dialog" aria-labelledby="create-title" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <form class="modal-content" id="create-form" novalidate autocomplete="off">
        <div class="modal-header">
          <h5 class="modal-title" id="create-title">Thêm tài khoản</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Đóng"><span aria-hidden="true">&times;</span></button>
        </div>
        <div class="modal-body">
          <div id="create-error" class="alert alert-danger d-none"></div>
          <div class="form-group">
            <label for="c-role">Vai trò</label>
            <select id="c-role" class="form-control">
              <option value="1">Giảng viên</option>
              <option value="0">Quản trị viên</option>
              <option value="2">Sinh viên</option>
              <option value="3">Khách (tự luyện)</option>
            </select>
            <small class="form-text text-muted">Sinh viên nên tạo hàng loạt bằng trang Import.</small>
          </div>
          <div class="form-group">
            <label for="c-username">Tên đăng nhập</label>
            <input id="c-username" class="form-control" maxlength="32" required placeholder="vd: gv.nguyenvana">
          </div>
          <div class="form-group">
            <label for="c-fullname">Họ và tên</label>
            <input id="c-fullname" class="form-control" maxlength="100" required>
          </div>
          <div class="form-group mb-0">
            <label for="c-password">Mật khẩu ban đầu</label>
            <input id="c-password" type="text" class="form-control text-mono" minlength="8" maxlength="128" required>
            <small class="form-text text-muted">Tối thiểu 8 ký tự. Người dùng phải đổi ở lần đăng nhập đầu.</small>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary" id="btn-create">Tạo tài khoản</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/vendor/adminlte/adminlte.min.js"></script>
<script type="module" src="/assets/js/admin-users.js"></script>
</body>
</html>
