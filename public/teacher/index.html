<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Khóa học · LAN LMS</title>
  <link rel="stylesheet" href="/vendor/fonts/source-sans-pro.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/vendor/adminlte/adminlte.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed app-loading">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light" id="app-navbar"></nav>
  <aside class="main-sidebar sidebar-dark-primary elevation-4" id="app-sidebar"></aside>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid d-flex flex-wrap justify-content-between align-items-center">
        <h1 class="m-0" id="page-title">Khóa học của tôi</h1>
        <button type="button" class="btn btn-primary btn-sm mt-2 mt-sm-0" data-toggle="modal" data-target="#course-modal">
          <i class="fas fa-plus mr-1"></i>Tạo khóa học
        </button>
      </div>
    </div>

    <section class="content">
      <div class="container-fluid">
        <div class="row" id="course-list">
          <div class="col-12 empty-state">Đang tải...</div>
        </div>
      </div>
    </section>
  </div>

  <footer class="main-footer small">LAN LMS · beta</footer>

  <div class="modal fade" id="course-modal" tabindex="-1" role="dialog" aria-labelledby="course-modal-title" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <form class="modal-content" id="course-form" novalidate autocomplete="off">
        <div class="modal-header">
          <h5 class="modal-title" id="course-modal-title">Tạo khóa học</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Đóng"><span aria-hidden="true">&times;</span></button>
        </div>
        <div class="modal-body">
          <div id="course-error" class="alert alert-danger d-none"></div>
          <div class="form-row">
            <div class="form-group col-sm-4">
              <label for="f-code">Mã học phần</label>
              <input id="f-code" class="form-control text-mono" maxlength="32" required placeholder="INT1340">
            </div>
            <div class="form-group col-sm-8">
              <label for="f-title">Tên khóa học</label>
              <input id="f-title" class="form-control" maxlength="200" required placeholder="Lập trình mạng">
            </div>
          </div>
          <div class="form-group">
            <label for="f-desc">Mô tả <small class="text-muted">(không bắt buộc)</small></label>
            <textarea id="f-desc" class="form-control" rows="3" maxlength="2000"></textarea>
          </div>
          <div class="form-group mb-0">
            <label>Cách sắp xếp nội dung</label>
            <div class="custom-control custom-radio">
              <input type="radio" id="fmt-1" name="format" value="1" class="custom-control-input" checked>
              <label class="custom-control-label" for="fmt-1"><b>Theo tuần</b>: Tuần 1, Tuần 2, …</label>
            </div>
            <div class="custom-control custom-radio">
              <input type="radio" id="fmt-0" name="format" value="0" class="custom-control-input">
              <label class="custom-control-label" for="fmt-0"><b>Mặc định</b>: các mục tự đặt tên (Chương 1, Bài đọc thêm…)</label>
            </div>
            <div class="custom-control custom-radio">
              <input type="radio" id="fmt-2" name="format" value="2" class="custom-control-input">
              <label class="custom-control-label" for="fmt-2"><b>Chỉ danh sách file</b>: không chia mục</label>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary" id="btn-save-course">Tạo khóa học</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/vendor/adminlte/adminlte.min.js"></script>
<script type="module" src="/assets/js/teacher-courses.js"></script>
</body>
</html>
