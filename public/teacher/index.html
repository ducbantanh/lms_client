<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Khóa học · FIT LMS (Khoa CNTT - Đại học Hà Nội)</title>
  <link rel="stylesheet" href="/vendor/fonts/source-sans-pro.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/vendor/adminlte/adminlte.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed app-loading">
<div class="wrapper">
  
  <nav class="main-header navbar navbar-expand navbar-white navbar-light" id="app-navbar"></nav>
  <aside class="main-sidebar sidebar-dark-primary elevation-4" id="app-sidebar"></aside>

  <div class="content-wrapper">
    <!-- Header Section -->
    <div class="content-header bg-white border-bottom py-3 mb-4">
      <div class="container-fluid d-flex flex-wrap justify-content-between align-items-center">
        <div>
          <h1 class="m-0 font-weight-bold" style="font-size: 1.55rem; color: var(--fit-slate-dark);" id="page-title">
            Khóa học của tôi
          </h1>
          <p class="text-muted small mb-0 mt-1">
            <i class="fas fa-chalkboard-teacher mr-1 text-fit-orange"></i>Quản lý học phần, tài liệu giảng dạy và bài kiểm tra
          </p>
        </div>
        <div class="mt-2 mt-sm-0">
          <button type="button" class="btn btn-primary btn-sm shadow-sm" data-toggle="modal" data-target="#course-modal">
            <i class="fas fa-plus-circle mr-1"></i>Tạo khóa học mới
          </button>
        </div>
      </div>
    </div>

    <!-- Course Grid Section -->
    <section class="content">
      <div class="container-fluid">
        <div class="row" id="course-list">
          <div class="col-12 empty-state"><i class="fas fa-spinner fa-spin"></i>Đang tải dữ liệu khóa học...</div>
        </div>
      </div>
    </section>
  </div>

  <!-- University Footer -->
  <footer class="main-footer small">
    <div class="d-flex justify-content-between flex-wrap">
      <span>&copy; 2026 Faculty of Information Technology - Hanoi University. All rights reserved.</span>
      <span>FIT LMS · LAN Edition</span>
    </div>
  </footer>

  <!-- Modal Tạo Khóa Học -->
  <div class="modal fade" id="course-modal" tabindex="-1" role="dialog" aria-labelledby="course-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <form class="modal-content border-0 shadow-lg" id="course-form" novalidate autocomplete="off" style="border-top: 4px solid var(--fit-orange) !important;">
        <div class="modal-header bg-light">
          <h5 class="modal-title font-weight-bold" id="course-modal-title" style="color: var(--fit-slate-dark);">
            <i class="fas fa-folder-plus text-fit-orange mr-2"></i>Tạo khóa học mới
          </h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Đóng"><span aria-hidden="true">&times;</span></button>
        </div>
        <div class="modal-body p-4">
          <div id="course-error" class="alert alert-danger d-none"></div>
          
          <div class="form-row">
            <div class="form-group col-sm-4">
              <label for="f-code" class="small font-weight-bold text-muted">MÃ HỌC PHẦN</label>
              <input id="f-code" class="form-control text-mono text-uppercase" maxlength="32" required placeholder="INT1340">
            </div>
            <div class="form-group col-sm-8">
              <label for="f-title" class="small font-weight-bold text-muted">TÊN KHÓA HỌC / MÔN HỌC</label>
              <input id="f-title" class="form-control" maxlength="200" required placeholder="Lập trình mạng">
            </div>
          </div>

          <div class="form-group">
            <label for="f-desc" class="small font-weight-bold text-muted">MÔ TẢ KHÓA HỌC <small class="text-muted">(không bắt buộc)</small></label>
            <textarea id="f-desc" class="form-control" rows="3" maxlength="2000" placeholder="Thông tin tóm tắt về môn học, yêu cầu bài giảng..."></textarea>
          </div>

          <div class="form-group mb-0">
            <label class="small font-weight-bold text-muted mb-2">ĐỊNH DẠNG TỔ CHỨC NỘI DUNG</label>
            <div class="p-3 bg-light rounded border">
              <div class="custom-control custom-radio mb-2">
                <input type="radio" id="fmt-1" name="format" value="1" class="custom-control-input" checked>
                <label class="custom-control-label font-weight-bold" for="fmt-1">
                  Theo tuần học <span class="text-muted font-weight-normal">(Tuần 1, Tuần 2, Tuần 3...)</span>
                </label>
              </div>
              <div class="custom-control custom-radio mb-2">
                <input type="radio" id="fmt-0" name="format" value="0" class="custom-control-input">
                <label class="custom-control-label font-weight-bold" for="fmt-0">
                  Theo chủ đề tự đặt <span class="text-muted font-weight-normal">(Chương 1, Bài đọc thêm, Đồ án...)</span>
                </label>
              </div>
              <div class="custom-control custom-radio">
                <input type="radio" id="fmt-2" name="format" value="2" class="custom-control-input">
                <label class="custom-control-label font-weight-bold" for="fmt-2">
                  Chỉ danh sách file <span class="text-muted font-weight-normal">(Không phân chia danh mục)</span>
                </label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-default" data-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary" id="btn-save-course">
            <i class="fas fa-check mr-1"></i>Xác nhận tạo
          </button>
        </div>
      </form>
    </div>
  </div>

</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/vendor/adminlte/adminlte.min.js"></script>
<script type="module" src="/assets/js/teacher-courses.js"></script>
</body>
</html>
