<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Trang sinh viên · LAN LMS</title>
  <link rel="stylesheet" href="/vendor/fonts/source-sans-pro.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/vendor/adminlte/adminlte.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="hold-transition layout-top-nav app-loading">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <div class="container">
      <a href="/student/" class="navbar-brand">
        <i class="fas fa-network-wired text-primary mr-1"></i>
        <span class="brand-text font-weight-light">LAN LMS</span>
      </a>
      <ul class="navbar-nav ml-auto align-items-center">
        <li class="nav-item mr-3"><span id="ws-status" class="badge badge-secondary">Mất kết nối</span></li>
        <li class="nav-item d-none d-sm-block mr-2 text-muted" id="nav-name"></li>
        <li class="nav-item">
          <button type="button" id="btn-logout" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-sign-out-alt mr-1"></i>Đăng xuất
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container">
        <h1 class="m-0">Xin chào, <span id="hello-name"></span></h1>
      </div>
    </div>

    <div class="content">
      <div class="container">
        <div class="row">
          <div class="col-lg-4">
            <div class="card card-primary card-outline">
              <div class="card-body box-profile">
                <div class="text-center mb-2">
                  <i class="fas fa-user-graduate fa-3x text-primary"></i>
                </div>
                <h3 class="profile-username text-center" id="p-name"></h3>
                <p class="text-muted text-center text-mono" id="p-username"></p>
                <ul class="list-group list-group-unbordered mb-3">
                  <li class="list-group-item"><b>Vai trò</b> <span class="float-right" id="p-role"></span></li>
                  <li class="list-group-item"><b>Trạng thái</b> <span class="float-right" id="p-online"></span></li>
                </ul>
                <a href="/change-password.html" class="btn btn-outline-primary btn-block">
                  <i class="fas fa-key mr-1"></i>Đổi mật khẩu
                </a>
              </div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="card">
              <div class="card-header"><h3 class="card-title"><i class="fas fa-book mr-1"></i>Khóa học của tôi</h3></div>
              <div class="card-body pb-1">
                <form id="join-form" class="input-group input-group-sm mb-3" novalidate autocomplete="off">
                  <input id="join-key" class="form-control text-mono text-uppercase" maxlength="16" placeholder="Nhập mã tham gia do giảng viên cung cấp">
                  <div class="input-group-append">
                    <button type="submit" class="btn btn-primary" id="btn-join"><i class="fas fa-sign-in-alt mr-1"></i>Tham gia</button>
                  </div>
                </form>
                <div id="courses" class="list-group list-group-flush mx-n3"></div>
              </div>
            </div>

            <div class="card">
              <div class="card-header"><h3 class="card-title"><i class="fas fa-bell mr-1"></i>Thông báo</h3></div>
              <div class="card-body p-0">
                <ul class="list-group list-group-flush" id="notices">
                  <li class="list-group-item empty-state"><i class="fas fa-inbox"></i>Chưa có thông báo</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="main-footer small"><div class="container">LAN LMS · beta</div></footer>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/vendor/adminlte/adminlte.min.js"></script>
<script type="module" src="/assets/js/student-dashboard.js"></script>
</body>
</html>
