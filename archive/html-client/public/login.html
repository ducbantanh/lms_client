<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Đăng nhập · LAN LMS</title>
  <link rel="stylesheet" href="/vendor/fonts/source-sans-pro.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/vendor/adminlte/adminlte.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="hold-transition login-page app-loading" data-page="login">
  <div class="login-box app-content">
    <div class="login-logo">
      <i class="fas fa-network-wired text-primary"></i> <b>LAN</b> LMS
    </div>
    <div class="card">
      <div class="card-body login-card-body">
        <p class="login-box-msg">Đăng nhập để bắt đầu</p>

        <div id="form-error" class="alert alert-danger d-none" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="input-group mb-3">
            <input type="text" class="form-control" id="username" name="username" placeholder="Tên đăng nhập / Mã SV"
                   autocomplete="username" maxlength="32" required autofocus>
            <div class="input-group-append">
              <div class="input-group-text"><span class="fas fa-user"></span></div>
            </div>
          </div>
          <div class="input-group mb-3">
            <input type="password" class="form-control" id="password" name="password" placeholder="Mật khẩu"
                   autocomplete="current-password" maxlength="128" required>
            <div class="input-group-append">
              <div class="input-group-text"><span class="fas fa-lock"></span></div>
            </div>
          </div>
          <button type="submit" id="btn-login" class="btn btn-primary btn-block">Đăng nhập</button>
        </form>

        <p class="mt-3 mb-0 text-muted small">
          Sinh viên đăng nhập lần đầu: tên đăng nhập là mã SV, mật khẩu là ngày sinh dạng <code>ddmmyyyy</code>.
        </p>
      </div>
    </div>
  </div>

  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/vendor/adminlte/adminlte.min.js"></script>
  <script type="module" src="/assets/js/auth-pages.js"></script>
</body>
</html>
