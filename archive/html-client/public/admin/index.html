<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Tổng quan · LAN LMS</title>
  <link rel="stylesheet" href="/vendor/fonts/source-sans-pro.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/vendor/adminlte/adminlte.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed app-loading">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light" id="app-navbar"></nav>
  <aside class="main-sidebar sidebar-dark-primary elevation-4" id="app-sidebar"></aside>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <h1 class="m-0">Tổng quan</h1>
      </div>
    </div>

    <section class="content">
      <div class="container-fluid">
        <div class="row" id="stat-row">
          <div class="col-lg-3 col-6 stat-admin-only">
            <div class="small-box bg-info">
              <div class="inner"><h3 id="stat-total">–</h3><p>Tổng tài khoản</p></div>
              <div class="icon"><i class="fas fa-users"></i></div>
              <a href="/admin/users.html" class="small-box-footer">Xem danh sách <i class="fas fa-arrow-circle-right"></i></a>
            </div>
          </div>
          <div class="col-lg-3 col-6 stat-admin-only">
            <div class="small-box bg-primary">
              <div class="inner"><h3 id="stat-students">–</h3><p>Sinh viên</p></div>
              <div class="icon"><i class="fas fa-user-graduate"></i></div>
              <a href="/admin/users.html?role=5" class="small-box-footer">Xem sinh viên <i class="fas fa-arrow-circle-right"></i></a>
            </div>
          </div>
          <div class="col-lg-3 col-6">
            <div class="small-box bg-success">
              <div class="inner"><h3 id="stat-online">–</h3><p>Đang online</p></div>
              <div class="icon"><i class="fas fa-signal"></i></div>
              <a href="#online-card" class="small-box-footer">Xem bên dưới <i class="fas fa-arrow-circle-down"></i></a>
            </div>
          </div>
          <div class="col-lg-3 col-6 stat-admin-only">
            <div class="small-box bg-danger">
              <div class="inner"><h3 id="stat-locked">–</h3><p>Tài khoản bị khóa</p></div>
              <div class="icon"><i class="fas fa-user-lock"></i></div>
              <a href="/admin/users.html?status=0" class="small-box-footer">Xem tài khoản khóa <i class="fas fa-arrow-circle-right"></i></a>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-8">
            <div class="card" id="online-card">
              <div class="card-header">
                <h3 class="card-title"><i class="fas fa-circle status-dot text-success mr-1"></i>Đang online</h3>
              </div>
              <div class="card-body p-0 table-responsive">
                <table class="table table-hover mb-0">
                  <thead>
                    <tr class="text-nowrap"><th>Tài khoản</th><th>Họ tên</th><th class="d-none d-md-table-cell">Vai trò</th><th class="d-none d-md-table-cell">Kết nối</th><th class="d-none d-sm-table-cell">Từ lúc</th><th></th></tr>
                  </thead>
                  <tbody id="online-body">
                    <tr><td colspan="6" class="empty-state">Đang tải...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card">
              <div class="card-header">
                <h3 class="card-title"><i class="fas fa-stream mr-1"></i>Hoạt động realtime</h3>
              </div>
              <div class="card-body p-0">
                <ul class="list-group list-group-flush" id="feed">
                  <li class="list-group-item empty-state"><i class="fas fa-inbox"></i>Chưa có hoạt động</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer class="main-footer small">LAN LMS · beta</footer>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/vendor/adminlte/adminlte.min.js"></script>
<script type="module" src="/assets/js/admin-dashboard.js"></script>
</body>
</html>
